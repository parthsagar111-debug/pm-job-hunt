name: TEMP — measure output tokens

# Temporary. The API key is a secret, so the measurement cannot run locally.
# Delete this file once the numbers are in.
on:
  workflow_dispatch:

concurrency:
  group: measure-tmp
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements_hosted.txt

      # Prints token counts and field names only. It must not print the prompt, the
      # profile, or the reason/gap prose — this repository's logs are public.
      - name: Measure
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CANDIDATE_PROFILE: ${{ secrets.CANDIDATE_PROFILE }}
        run: python scripts/measure_output_tokens.py
