name: PM Hiring Posts — LinkedIn Feed (Apify, no eval)

on:
  workflow_dispatch:   # triggered externally by cron-job.org via GitHub API
    inputs:
      posted_limit:
        description: 'Apify postedLimit window (24h, week, month, etc.) — defaults to 24h for the daily cron; widen for manual backfill runs.'
        required: false
        default: '24h'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements_hosted.txt

      - name: Run PM Hiring Posts Feed
        env:
          APIFY_API_TOKEN:             ${{ secrets.APIFY_API_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          PM_POSTS_SPREADSHEET_ID:     ${{ secrets.PM_POSTS_SPREADSHEET_ID }}
          NTFY_TOPIC:                  ${{ secrets.NTFY_TOPIC }}
          POSTED_LIMIT:                ${{ inputs.posted_limit }}
        run: python pm_posts_hosted.py
