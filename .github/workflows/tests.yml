name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    # Pinned deliberately. On 2026-11-01 the ubuntu-latest label moved from 24.04 to
    # 26.04 mid-day and every PM Eval run began failing: the Chrome install step used
    # apt-key, which 26.04 no longer ships. A moving label means an image migration can
    # break a working feed without a commit. Revisit before 24.04 leaves support.
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements_hosted.txt
          pip install -r requirements_dev.txt

      # No network and no API key: every test here is offline by design, so a
      # failure means the logic broke, not that LinkedIn or Anthropic had a bad day.
      - name: Run tests
        run: python -m pytest tests -q
