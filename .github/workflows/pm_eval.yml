name: PM Eval — India Jobs

on:
  workflow_dispatch:   # triggered externally by cron-job.org via GitHub API
    inputs:
      time_range:
        description: 'How far back to scrape - 24h for scheduled runs, week for a 7-day backfill.'
        required: false
        default: '24h'
        type: choice
        options:
          - 24h
          - week

jobs:
  run:
    # Pinned deliberately. On 2026-11-01 the ubuntu-latest label moved from 24.04 to
    # 26.04 mid-day and every PM Eval run began failing: the Chrome install step used
    # apt-key, which 26.04 no longer ships. A moving label means an image migration can
    # break a working feed without a commit. Revisit before 24.04 leaves support.
    runs-on: ubuntu-24.04
    timeout-minutes: 120   # 45 fits a 24h run; a 7-day backfill needs the headroom

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # GitHub's Ubuntu images already ship Chrome, so the install is a fallback. When
      # it is needed, the key goes in its own keyring referenced by signed-by= rather
      # than through apt-key: apt-key put a key in ONE global trusted keyring, so a key
      # added for Chrome was also trusted for every other repo on the system. It was
      # deprecated for several releases and 26.04 dropped it, which broke this step.
      - name: Install Chrome (for Selenium — Naukri/Hirist/IIMJobs)
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "Chrome already present: $(google-chrome --version)"
          else
            KEYRING=/usr/share/keyrings/google-chrome.gpg
            wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o "$KEYRING"
            echo "deb [arch=amd64 signed-by=$KEYRING] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
            sudo apt-get update -q
            sudo apt-get install -y google-chrome-stable
          fi

      - name: Install Python dependencies
        run: pip install -r requirements_hosted.txt


      - name: Run PM Eval
        env:
          ANTHROPIC_API_KEY:           ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          PM_EVAL_SPREADSHEET_ID:      ${{ secrets.PM_EVAL_SPREADSHEET_ID }}
          # The candidate profile the classifier scores against — rendered from
          # resume_facts.json by job-automation's build_candidate_profile.py. Kept in a
          # secret because this repo is public.
          CANDIDATE_PROFILE:           ${{ secrets.CANDIDATE_PROFILE }}
          NTFY_TOPIC:                  ${{ secrets.NTFY_TOPIC }}
          # Absent on the scheduled runs (cron-job.org sends no inputs), so they stay 24h.
          TIME_RANGE:                  ${{ inputs.time_range || '24h' }}
        run: python pm_eval_hosted.py
