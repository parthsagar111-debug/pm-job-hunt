name: Global Visa PM — worldwide roles that sponsor visas

on:
  workflow_dispatch:   # run by hand from the Actions tab; no cron, no schedule
    inputs:
      time_range:
        description: 'How far back to scrape. 24h suits the twice-daily cron; week is a full sweep (slow).'
        required: false
        default: '24h'
        type: choice
        options:
          - 24h
          - week

jobs:
  run:
    # Pinned deliberately. On 2026-11-01 the ubuntu-latest label moved from 24.04 to
    # 26.04 mid-day and every PM Eval run began failing: the Chrome install step used
    # apt-key, which 26.04 no longer ships. A moving label means an image migration can
    # break a working feed without a commit. Revisit before 24.04 leaves support.
    runs-on: ubuntu-24.04
    timeout-minutes: 350   # a full sweep took ~2h15m in the probe; the script stops itself at 5h

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements_hosted.txt

      # No Chrome/Playwright step: this feed reads JDs from LinkedIn's guest endpoint.

      - name: Run Global Visa PM feed
        env:
          ANTHROPIC_API_KEY:           ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GLOBAL_VISA_SPREADSHEET_ID:  ${{ secrets.GLOBAL_VISA_SPREADSHEET_ID }}
          NTFY_TOPIC:                  ${{ secrets.NTFY_TOPIC }}
          # cron-job.org calls the API with no inputs, so this fallback is what the
          # scheduled runs get. 24h matches a twice-daily cadence: a week window
          # re-scrapes the same seven days on every run and dedup discards it.
          TIME_RANGE:                  ${{ inputs.time_range || '24h' }}
          PYTHONUNBUFFERED:            '1'
        run: python global_visa_hosted.py
