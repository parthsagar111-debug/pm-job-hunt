name: Global Visa PM — worldwide roles that sponsor visas

on:
  workflow_dispatch:   # run by hand from the Actions tab; no cron, no schedule
    inputs:
      time_range:
        description: 'How far back to scrape. Defaults to the last 7 days (slow - a full sweep ran ~2h15m).'
        required: false
        default: 'week'
        type: choice
        options:
          - week
          - 24h

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # a full sweep took ~2h15m in the probe; the script stops itself at 5h

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements_hosted.txt

      # No Chrome/Playwright step: this feed reads JDs from LinkedIn's guest endpoint.

      - name: Run Global Visa PM feed
        env:
          ANTHROPIC_API_KEY:           ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GLOBAL_VISA_SPREADSHEET_ID:  ${{ secrets.GLOBAL_VISA_SPREADSHEET_ID }}
          NTFY_TOPIC:                  ${{ secrets.NTFY_TOPIC }}
          # 'week' when run from the Actions tab with no choice made, and when the
          # API is called without inputs. This feed is no longer on a schedule.
          TIME_RANGE:                  ${{ inputs.time_range || 'week' }}
          PYTHONUNBUFFERED:            '1'
        run: python global_visa_hosted.py
