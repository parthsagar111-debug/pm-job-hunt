name: Global Visa PM — worldwide roles that sponsor visas

on:
  workflow_dispatch:   # triggered externally by cron-job.org via GitHub API, or manually
    inputs:
      time_range:
        description: 'How far back to scrape — 24h for scheduled runs, week for a backfill (slow, may hit the runtime limit).'
        required: false
        default: '24h'
        type: choice
        options:
          - 24h
          - week

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # a full sweep took ~2h15m in the probe; the script stops itself at 5h

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements_hosted.txt

      # No Chrome/Playwright step: this feed reads JDs from LinkedIn's guest endpoint.

      - name: Run Global Visa PM feed
        env:
          ANTHROPIC_API_KEY:           ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GLOBAL_VISA_SPREADSHEET_ID:  ${{ secrets.GLOBAL_VISA_SPREADSHEET_ID }}
          NTFY_TOPIC:                  ${{ secrets.NTFY_TOPIC }}
          TIME_RANGE:                  ${{ inputs.time_range || '24h' }}
          PYTHONUNBUFFERED:            '1'
        run: python global_visa_hosted.py
