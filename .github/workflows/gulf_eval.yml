name: Gulf PM Eval — UAE / Saudi / Qatar / Bahrain / Oman / Kuwait

on:
  workflow_dispatch:   # run by hand from the Actions tab; no cron, no schedule
    inputs:
      time_range:
        description: 'How far back to scrape. Defaults to the last 7 days.'
        required: false
        default: 'week'
        type: choice
        options:
          - week
          - 24h

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # a week-long backfill fetches + evaluates a few hundred JDs

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements_hosted.txt


      - name: Run Gulf PM Eval
        env:
          ANTHROPIC_API_KEY:           ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GULF_SPREADSHEET_ID:         ${{ secrets.GULF_SPREADSHEET_ID }}
          # Needed since this feed moved to the shared feature prompt, which reads
          # the candidate profile from this secret instead of hardcoding it.
          CANDIDATE_PROFILE:           ${{ secrets.CANDIDATE_PROFILE }}
          NTFY_TOPIC:                  ${{ secrets.NTFY_TOPIC }}
          # 'week' when run from the Actions tab with no choice made, and when the
          # API is called without inputs. This feed is no longer on a schedule.
          TIME_RANGE:                  ${{ inputs.time_range || 'week' }}
        run: python gulf_eval_hosted.py
